name: Publish website

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST daily rebuild so the Pinterest feed releases the day's pins
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reuse share images from earlier builds
        uses: actions/cache@v4
        with:
          path: .og-cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: Allow publishing
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - name: Build and publish
        run: bash deploy.sh
